name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint YAML files
        run: yamllint -d relaxed .

      - name: Lint and check Python formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Compile Python sources
        run: python3 -m compileall -q fake_solis_probe

      - name: Run regression tests
        run: |
          python3 -B fake_solis_probe/tests/test_behavior.py
          python3 -B fake_solis_probe/tests/test_log_rotation.py
          python3 -B -m pytest fake_solis_probe/tests/test_register_mapping.py
